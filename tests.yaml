- name: '[Consent] Google Consent Mode state is pushed before init and updates are forwarded'
  code: |-
    runCode(createMockData({ enableGoogleConsentMode: true }));

    assertThat(windowCalls[0]).isEqualTo({
      fn: 'UET_push',
      args: ['uetq', 'consent', 'default', { ad_storage: 'granted' }]
    });
    assertThat(windowCalls[1].fn).isEqualTo('UET_init');
    assertThat(windowCalls[2].args).isEqualTo(['uetq', 'pageLoad']);
    assertThat(consentListeners.length).isEqualTo(1);

    // Same state is not pushed again; changes are pushed as updates.
    consentListeners[0]('ad_storage', true);
    assertThat(getUetPushes().length).isEqualTo(2);
    consentListeners[0]('ad_storage', false);
    consentListeners[0]('ad_storage', false);
    consentListeners[0]('analytics_storage', true);
    const pushes = getUetPushes();
    assertThat(pushes.length).isEqualTo(3);
    assertThat(pushes[2]).isEqualTo(['uetq', 'consent', 'update', { ad_storage: 'denied' }]);

    // A second tag fire does not add another listener.
    runCode(createMockData({ enableGoogleConsentMode: true, eventType: 'custom', eventNameCustom: 'x' }));
    assertThat(consentListeners.length).isEqualTo(1);
    assertThat(getUetPushes()[3]).isEqualTo(['uetq', 'consent', 'update', { ad_storage: 'granted' }]);

    assertApi('gtmOnSuccess').wasCalled();
    assertApi('gtmOnFailure').wasNotCalled();
- name: '[Consent] Advanced mode with denied consent loads the tag and sends events'
  code: |-
    mock('isConsentGranted', () => false);

    runCode(createMockData({ enableGoogleConsentMode: true, consentMode: 'advanced' }));

    assertThat(injectScriptCalls.length).isEqualTo(1);
    assertThat(getUetPushes()).isEqualTo([
      ['uetq', 'consent', 'default', { ad_storage: 'denied' }],
      ['uetq', 'pageLoad']
    ]);

    assertApi('gtmOnSuccess').wasCalled();
    assertApi('gtmOnFailure').wasNotCalled();
- name: '[Consent] Basic mode with Google Consent Mode denied defers the event until granted'
  code: |-
    mock('isConsentGranted', () => false);

    runCode(
      createMockData({
        enableGoogleConsentMode: true,
        consentMode: 'basic',
        eventType: 'standard',
        eventNameStandard: 'sign_up'
      })
    );

    assertThat(injectScriptCalls.length).isEqualTo(0);
    assertThat(windowCalls.length).isEqualTo(0);
    assertThat(consentListeners.length).isEqualTo(1);
    assertApi('gtmOnSuccess').wasCalled();

    // Denied updates are ignored.
    consentListeners[0]('ad_storage', false);
    assertThat(injectScriptCalls.length).isEqualTo(0);

    consentListeners.slice(0).forEach((listener) => listener('ad_storage', true));

    assertThat(injectScriptCalls.length).isEqualTo(1);
    assertThat(getUetPushes()).isEqualTo([
      ['uetq', 'consent', 'default', { ad_storage: 'granted' }],
      ['uetq', 'event', 'sign_up', {}]
    ]);

    // The queued callbacks run only once.
    consentListeners[0]('ad_storage', true);
    assertThat(injectScriptCalls.length).isEqualTo(1);

    assertApi('gtmOnFailure').wasNotCalled();
- name: '[Consent] Basic mode with manual consent denied does not load the tag'
  code: |-
    runCode(createMockData({ adStorageConsent: 'denied', consentMode: 'basic' }));

    assertThat(injectScriptCalls.length).isEqualTo(0);
    assertThat(windowCalls.length).isEqualTo(0);
    assertApi('addConsentListener').wasNotCalled();
    assertApi('gtmOnSuccess').wasCalled();
    assertApi('gtmOnFailure').wasNotCalled();
- name: '[Consent] Manual consent values are normalized and pushed as default then update'
  code: |-
    [
      { value: true, expected: 'granted' },
      { value: 'true', expected: 'granted' },
      { value: 1, expected: 'granted' },
      { value: 'granted', expected: 'granted' },
      { value: false, expected: 'denied' },
      { value: '0', expected: 'denied' },
      { value: 'denied', expected: 'denied' },
      { value: undefined, expected: undefined },
      { value: 'unknown', expected: undefined }
    ].forEach((scenario) => {
      cleanup();

      runCode(createMockData({ adStorageConsent: scenario.value }));

      const pushes = getUetPushes();
      if (scenario.expected) {
        assertThat(pushes[0]).isEqualTo([
          'uetq',
          'consent',
          'default',
          { ad_storage: scenario.expected }
        ]);
        assertThat(pushes[1]).isEqualTo(['uetq', 'pageLoad']);
      } else {
        assertThat(pushes).isEqualTo([['uetq', 'pageLoad']]);
      }
    });

    cleanup();
    runCode(createMockData({ adStorageConsent: 'denied' }));
    runCode(createMockData({ adStorageConsent: 'granted' }));
    assertThat(getUetPushes()[2]).isEqualTo(['uetq', 'consent', 'update', { ad_storage: 'granted' }]);
    assertApi('addConsentListener').wasNotCalled();

    assertApi('gtmOnSuccess').wasCalled();
    assertApi('gtmOnFailure').wasNotCalled();
- name: '[Consent] TCF is enabled once before init and Restricted Event Processing is flagged'
  code: |-
    const mockData = createMockData({
      enableTcf: true,
      restrictedEventProcessing: true,
      eventType: 'custom',
      eventNameCustom: 'lead'
    });
    runCode(mockData);
    runCode(mockData);

    assertThat(windowCalls[0]).isEqualTo({
      fn: 'UET_push',
      args: ['uetq', 'config', 'tcf', { enabled: true }]
    });
    assertThat(windowCalls[1].fn).isEqualTo('UET_init');
    assertThat(windowCalls[2].args).isEqualTo(['uetq', 'set', { rep: '1' }]);
    assertThat(windowCalls[3].args).isEqualTo(['uetq', 'event', 'lead', { rep: '1' }]);

    const tcfPushes = getUetPushes().filter((p) => p[1] === 'config');
    assertThat(tcfPushes.length).isEqualTo(1);

    // TCF is ignored when Google Consent Mode is enabled; REP false is not sent.
    cleanup();
    runCode(
      createMockData({ enableTcf: true, enableGoogleConsentMode: true, restrictedEventProcessing: false })
    );
    assertThat(getUetPushes().filter((p) => p[1] === 'config' || p[1] === 'set').length).isEqualTo(0);

    assertApi('gtmOnSuccess').wasCalled();
    assertApi('gtmOnFailure').wasNotCalled();
