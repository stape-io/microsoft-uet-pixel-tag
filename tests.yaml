        disableAutoConsent: true,
        cookieDomain: 'example.com',
        cookieFlags: 'SameSite=None;Secure',
        customConfigList: [
          { name: 'disableUetVid', value: 'true' },
          { name: 'navTimingApi', value: 'false' },
          { name: 'Ver', value: '2' }
        ]
      })
    );

    assertThat(windowCalls[0]).isEqualTo({
      fn: 'UET_init',
      args: [
        'uetq',
        {
          ti: '1234567',
          enableAutoSpaTracking: true,
          disableAutoPageView: true,
          storeConvTrackCookies: false,
          removeQueryFromUrls: true,
          navTimingApi: false,
          enableAutoConsent: false,
          cookieDomain: 'example.com',
          cookieFlags: 'SameSite=None;Secure',
          disableUetVid: true,
          Ver: '2'
        }
      ]
    });

    assertApi('gtmOnSuccess').wasCalled();
    assertApi('gtmOnFailure').wasNotCalled();
- name: '[UET Config] Custom queue name is used in every UET call'
  code: |-
    runCode(createMockData({ uetqName: 'uetq2', tagId: 123, adStorageConsent: 'granted' }));

    assertThat(windowCalls.length).isEqualTo(3);
    windowCalls.forEach((call) => assertThat(call.args[0]).isEqualTo('uetq2'));
    assertThat(windowCalls[1].args[1].ti).isEqualTo('123');

    assertApi('gtmOnSuccess').wasCalled();
    assertApi('gtmOnFailure').wasNotCalled();
- name: '[Multiple Tag IDs] Comma-separated Tag IDs get one queue each and receive the same event'
  code: |-
    runCode(
      createMockData({
        tagId: '111, 222 ,111,,333',
        eventType: 'standard',
        eventNameStandard: 'purchase',
        adStorageConsent: 'granted',
        restrictedEventProcessing: true,
        eventParametersList: [{ name: 'revenue_value', value: '10' }],
        userDataList: [{ name: 'em', value: 'john@example.com' }]
      })
    );

    assertThat(injectScriptCalls.length).isEqualTo(1);

    const inits = windowCalls.filter((c) => c.fn === 'UET_init').map((c) => c.args);
    assertThat(inits).isEqualTo([
      ['uetq', { ti: '111' }],
      ['uetq_222', { ti: '222' }],
      ['uetq_333', { ti: '333' }]
    ]);

    ['uetq', 'uetq_222', 'uetq_333'].forEach((queueName) => {
      const pushes = getUetPushes().filter((p) => p[0] === queueName);
      assertThat(pushes).isEqualTo([
        [queueName, 'consent', 'default', { ad_storage: 'granted' }],
        [queueName, 'set', { rep: '1' }],
        [
          queueName,
          'event',
          'purchase',
          { revenue_value: '10', rep: '1', pid: { em: 'john@example.com' } }
        ]
      ]);
    });

    assertApi('gtmOnSuccess').wasCalled();
    assertApi('gtmOnFailure').wasNotCalled();
- name: '[Multiple Tag IDs] Array of Tag IDs with custom queue name, Page View and consent per queue'
  code: |-
    const mockData = createMockData({
      tagId: ['111', 222],
      uetqName: 'myq',
      enableGoogleConsentMode: true
    });
    runCode(mockData);
    runCode(mockData);

    assertThat(getUetPushes()).isEqualTo([
      ['myq', 'consent', 'default', { ad_storage: 'granted' }],
      ['myq', 'pageLoad'],
      ['myq_222', 'consent', 'default', { ad_storage: 'granted' }],
      ['myq_222', 'pageLoad'],
      ['myq', 'event', 'page_view', { page_path: '/products?a=1', page_title: 'Page Title' }],
      ['myq_222', 'event', 'page_view', { page_path: '/products?a=1', page_title: 'Page Title' }]
    ]);

    // One Google Consent Mode listener per queue, each one updating its own queue.
    assertThat(consentListeners.length).isEqualTo(2);
    consentListeners.forEach((listener) => listener('ad_storage', false));
    const updates = getUetPushes().slice(6);
    assertThat(updates).isEqualTo([
      ['myq', 'consent', 'update', { ad_storage: 'denied' }],
      ['myq_222', 'consent', 'update', { ad_storage: 'denied' }]
    ]);

    assertApi('gtmOnSuccess').wasCalled();
    assertApi('gtmOnFailure').wasNotCalled();
- name: '[Multiple Tag IDs] Each Tag ID keeps its queue across tags, whatever its position in the list'
  code: |-
    runCode(createMockData({ tagId: '222' }));
    runCode(createMockData({ tagId: '111, 222' }));
    runCode(createMockData({ tagId: ['222', '111', '333'] }));
    runCode(createMockData({ tagId: '111', uetqName: 'myq' }));

    const inits = windowCalls.filter((c) => c.fn === 'UET_init').map((c) => [c.args[0], c.args[1].ti]);
    assertThat(inits).isEqualTo([
      ['uetq', '222'],
      ['uetq_111', '111'],
      ['uetq', '222'],
      ['uetq', '222'],
      ['uetq_111', '111'],
      ['uetq_333', '333'],
      ['myq', '111']
    ]);

    // Each queue sends its page load only once.
    const pageLoads = getUetPushes()
      .filter((p) => p[1] === 'pageLoad')
      .map((p) => p[0]);
    assertThat(pageLoads).isEqualTo(['uetq', 'uetq_111', 'uetq_333', 'myq']);

    assertApi('gtmOnSuccess').wasCalled();
    assertApi('gtmOnFailure').wasNotCalled();
- name: '[Event ID] Pushes the Event ID to the dataLayer when enabled'
  code: |-
    runCode(
      createMockData({
        eventType: 'standard',
        eventNameStandard: 'purchase',
        eventId: 'abc',
        pushEventIdToDataLayer: true,
        eventIdDataLayerEventName: 'purchase_unique',
        eventIdDataLayerVariableName: 'dataLayer'
      })
    );

    assertThat(queuePushes).isEqualTo([
      { name: 'dataLayer', item: { eventId: 'abc', event: 'purchase_unique' } }
    ]);
    assertThat(getUetPushes()[0][3].event_id).isEqualTo('abc');

    cleanup();
    runCode(createMockData({ eventId: 'abc' }));
    assertThat(queuePushes.length).isEqualTo(0);

    assertApi('gtmOnSuccess').wasCalled();
    assertApi('gtmOnFailure').wasNotCalled();
- name: '[Failure] Missing UET Tag ID calls gtmOnFailure'
  code: |-
    [undefined, null, '', '   ', 'undefined', 'null', ' , ,', [], ['', null]].forEach((tagId) => {
      cleanup();
      runCode(createMockData({ tagId: tagId }));
      assertThat(injectScriptCalls.length).isEqualTo(0);
    });

    assertApi('gtmOnSuccess').wasNotCalled();
    assertApi('gtmOnFailure').wasCalled();
- name: '[Failure] bat js load failure calls gtmOnFailure'
  code: |-
    injectScriptShouldFail = true;

    runCode(createMockData({}));

    assertThat(injectScriptCalls.length).isEqualTo(1);
    assertThat(windowCalls.length).isEqualTo(0);
    assertApi('gtmOnSuccess').wasNotCalled();
    assertApi('gtmOnFailure').wasCalled();
setup: |-
  const JSON = require('JSON');
  const Object = require('Object');

  const hashA = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';
  const hashB = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';

  const assign = (target, source) => {
    if (!source) return target;
    Object.keys(source).forEach((key) => {
      target[key] = source[key];
    });
    return target;
  };

  const baseMockData = {
    tagId: '1234567',
    eventNameSetupMethod: 'override',
    eventType: 'pageView',
    enableDataLayerMapping: false,
    enableMostRecentDataLayerEventOnly: false,
    enableEnhancedConversions: true,
    enableEventUserDataEnhancement: false,
    enableGoogleConsentMode: false,
    consentMode: 'advanced',
    enableTcf: false,
    userDataFromVariable: false,
    eventParametersFromVariable: false,
    pushEventIdToDataLayer: false,
    uetqName: 'uetq'
  };

  const createMockData = (overrides) => assign(assign({}, baseMockData), overrides);

  let injectScriptCalls;
  let injectScriptShouldFail;
  let windowCalls;
  let dataLayerValues;
  let dataLayerVersions;
  let consentListeners;
  let templateStorageData;
  let localStorageData;
  let localStorageReads;
  let localStorageWrites;
  let sha256Inputs;
  let queuePushes;

  const getUetPushes = () =>
    windowCalls.filter((c) => c.fn === 'UET_push').map((c) => c.args);

  const cleanup = () => {
    injectScriptCalls = [];
    injectScriptShouldFail = false;
    windowCalls = [];
    dataLayerValues = {};
    dataLayerVersions = [];
    consentListeners = [];
    templateStorageData = {};
    localStorageData = {};
    localStorageReads = 0;
    localStorageWrites = 0;
    sha256Inputs = [];
    queuePushes = [];
  };
  cleanup();

  mock('injectScript', (url, onSuccess, onFailure, cacheToken) => {
    injectScriptCalls.push({ url: url, cacheToken: cacheToken });
    if (injectScriptShouldFail) onFailure();
    else onSuccess();
  });

  mock('callInWindow', (fn, a1, a2, a3, a4) => {
    const args = [a1, a2, a3, a4];
    while (args.length && args[args.length - 1] === undefined) args.pop();
    windowCalls.push({ fn: fn, args: args });
  });

  mock('copyFromDataLayer', (key, version) => {
    dataLayerVersions.push(version);
    return dataLayerValues[key];
  });

  mock('isConsentGranted', () => true);

  mock('addConsentListener', (consentType, listener) => {
    consentListeners.push(listener);
  });

  mockObject('templateStorage', {
    getItem: (key) => templateStorageData[key],
    setItem: (key, value) => {
      templateStorageData[key] = value;
    }
  });

  mockObject('localStorage', {
    getItem: (key) => {
      localStorageReads++;
      return localStorageData[key];
    },
    setItem: (key, value) => {
      localStorageWrites++;
      localStorageData[key] = value;
    }
  });

  mock('sha256', (input, onSuccess, onFailure, options) => {
    sha256Inputs.push(input);
    onSuccess(input.indexOf('@') !== -1 ? hashA : hashB);
  });

  mock('createQueue', (name) => {
    return (item) => {
      queuePushes.push({ name: name, item: item });
    };
  });

  mock('getUrl', (component) => {
    if (component === 'path') return '/products';
    if (component === 'query') return 'a=1';
    return 'https://example.com/products?a=1';
  });

  mock('readTitle', 'Page Title');
