    const pushes = getUetPushes();
    assertThat(pushes.length).isEqualTo(1);
    assertThat(pushes[0]).isEqualTo([
      'uetq',
      'event',
      'purchase',
      {
        event_category: 'checkout',
        currency: 'USD',
        revenue_value: '10.5',
        event_label: 'label',
