- name: '[Standard Event] Sends event with parameters from variable and table, and event ID'
  code: |-
    runCode(
      createMockData({
        eventType: 'standard',
        eventNameStandard: 'purchase',
        eventId: 'event-123',
        eventParametersFromVariable: { event_category: 'checkout', currency: 'usd', revenue_value: 5 },
        eventParametersList: [
          { name: 'revenue_value', value: '10.5' },
          { name: 'event_label', value: 'label' },
          { name: 'transaction_id', value: 'T-1' }
        ]
      })
