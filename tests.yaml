- name: '[Data Layer Mapping] Value from items, page type from event and most recent Data Layer version'
  code: |-
    dataLayerValues = {
      event: 'add_to_cart',
      currency: 'USD',
      items: [
        { item_id: 'A', price: 10, quantity: 3 },
        { id: 'B', price: 5 }
      ]
    };

    runCode(
      createMockData({
        eventNameSetupMethod: 'inherit',
        enableDataLayerMapping: true,
        enableMostRecentDataLayerEventOnly: true
      })
    );

    const params = getUetPushes()[0][3];
    assertThat(getUetPushes()[0][2]).isEqualTo('add_to_cart');
    assertThat(params.items).isEqualTo([
      { id: 'A', quantity: 3, price: 10 },
      { id: 'B', quantity: 1, price: 5 }
    ]);
    assertThat(params.ecomm_prodid).isEqualTo(['A', 'B']);
    assertThat(params.ecomm_pagetype).isEqualTo('product');
    assertThat(params.revenue_value).isEqualTo(35);
    assertThat(params.ecomm_totalvalue).isEqualTo(35);
    assertThat(params.currency).isEqualTo('USD');
    assertThat(dataLayerVersions.indexOf(2)).isEqualTo(-1);
    assertThat(dataLayerVersions.indexOf(1)).isNotEqualTo(-1);

    assertApi('gtmOnSuccess').wasCalled();
    assertApi('gtmOnFailure').wasNotCalled();
