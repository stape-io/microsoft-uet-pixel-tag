    assertApi('gtmOnFailure').wasNotCalled();
- name: '[Custom Event] Sends custom and empty event actions, page view names are Page Views'
  code: |-
    [
      { eventNameCustom: 'newsletter_signup', expected: ['uetq', 'event', 'newsletter_signup'] },
      { eventNameCustom: undefined, expected: ['uetq', 'event', ''] },
      { eventNameCustom: 'pageLoad', expected: ['uetq', 'pageLoad'] },
      { eventNameCustom: 'page_view', expected: ['uetq', 'pageLoad'] }
    ].forEach((scenario) => {
      cleanup();

      runCode(
        createMockData({
          eventType: 'custom',
          eventNameCustom: scenario.eventNameCustom,
          eventParametersList: [{ name: 'event_category', value: 'cat' }]
        })
      );

      const push = getUetPushes()[0];
      assertThat(push.slice(0, scenario.expected.length)).isEqualTo(scenario.expected);
      if (scenario.expected[1] === 'event') {
        assertThat(push[3]).isEqualTo({ event_category: 'cat' });
      } else {
        assertThat(push.length).isEqualTo(2);
      }
    });

    assertApi('gtmOnSuccess').wasCalled();
    assertApi('gtmOnFailure').wasNotCalled();
