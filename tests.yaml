scenarios:
- name: '[Page View] Loads bat js, initializes UET and sends pageLoad'
  code: |-
    runCode(createMockData({}));

    assertThat(injectScriptCalls.length).isEqualTo(1);
    assertThat(injectScriptCalls[0].url).isEqualTo('https://bat.bing.com/bat.js');
    assertThat(injectScriptCalls[0].cacheToken).isEqualTo('uetPixel');

    assertThat(windowCalls.length).isEqualTo(2);
    assertThat(windowCalls[0]).isEqualTo({
      fn: 'UET_init',
      args: ['uetq', { ti: '1234567' }]
    });
    assertThat(windowCalls[1]).isEqualTo({ fn: 'UET_push', args: ['uetq', 'pageLoad'] });

    assertApi('addConsentListener').wasNotCalled();
    assertApi('gtmOnSuccess').wasCalled();
    assertApi('gtmOnFailure').wasNotCalled();
- name: '[Page View] Second Page View on the same page is sent as SPA page_view'
  code: |-
    const mockData = createMockData({});
    runCode(mockData);
    runCode(mockData);

    const pushes = getUetPushes();
    assertThat(pushes.length).isEqualTo(2);
    assertThat(pushes[0]).isEqualTo(['uetq', 'pageLoad']);
    assertThat(pushes[1]).isEqualTo([
      'uetq',
      'event',
      'page_view',
      { page_path: '/products?a=1', page_title: 'Page Title' }
    ]);

    // Page path, title and location from the Event Parameters table take precedence.
    runCode(
      createMockData({
        eventParametersList: [
          { name: 'page_path', value: '/custom' },
          { name: 'page_title', value: 'Custom Title' },
          { name: 'page_location', value: 'https://example.com/custom' }
        ]
      })
    );
    assertThat(getUetPushes()[2]).isEqualTo([
      'uetq',
      'event',
      'page_view',
      {
        page_path: '/custom',
        page_title: 'Custom Title',
        page_location: 'https://example.com/custom'
      }
    ]);

    assertApi('gtmOnSuccess').wasCalled();
    assertApi('gtmOnFailure').wasNotCalled();
- name: '[Page View] Every Page View is a virtual page_view when the automatic page load hit is disabled'
  code: |-
    const mockData = createMockData({
      disableAutoPageView: true,
      userDataList: [{ name: 'em', value: 'john@example.com' }]
    });
    runCode(mockData);
    runCode(mockData);

    const virtualPageView = [
      'uetq',
      'event',
      'page_view',
      { page_path: '/products?a=1', page_title: 'Page Title' }
    ];
    assertThat(windowCalls[0].args[1].disableAutoPageView).isEqualTo(true);
    assertThat(getUetPushes()).isEqualTo([
      ['uetq', 'set', { pid: { em: 'john@example.com' } }],
      virtualPageView,
      ['uetq', 'set', { pid: { em: 'john@example.com' } }],
      virtualPageView
    ]);

    // Also when it is set through the Additional UET Tag Configuration.
    cleanup();
    runCode(
      createMockData({
        tagId: '111',
        customConfigList: [{ name: 'disableAutoPageView', value: 'true' }]
      })
    );
    assertThat(getUetPushes()).isEqualTo([
      ['uetq', 'event', 'page_view', { page_path: '/products?a=1', page_title: 'Page Title' }]
    ]);

    assertApi('gtmOnSuccess').wasCalled();
    assertApi('gtmOnFailure').wasNotCalled();
