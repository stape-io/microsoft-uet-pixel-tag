- name: '[Event User Data Enhancement] Stores normalized hashed user data and reuses it'
  code: |-
    runCode(
      createMockData({
        enableEventUserDataEnhancement: true,
        eventType: 'standard',
        eventNameStandard: 'sign_up',
        userDataList: [
          { name: 'em', value: ' John.Doe+news@Example.com ' },
          { name: 'ph', value: '1 (425) 555-1234' }
        ]
      })
    );

    assertThat(sha256Inputs).isEqualTo(['johndoe@example.com', '+14255551234']);
    assertThat(localStorageData['gtmeec-ms']).isEqualTo(JSON.stringify({ em: hashA, ph: hashB }));
    // The raw values are sent to the UET tag, which normalizes and hashes them.
    assertThat(getUetPushes()[0][3].pid).isEqualTo({
      em: ' John.Doe+news@Example.com ',
      ph: '1 (425) 555-1234'
    });

    // Next event without user data reuses the stored hashed user data.
    cleanup();
    localStorageData['gtmeec-ms'] = JSON.stringify({ em: hashA, ph: hashB });
    runCode(
      createMockData({
        enableEventUserDataEnhancement: true,
        eventType: 'standard',
        eventNameStandard: 'purchase'
      })
    );
    assertThat(getUetPushes()[0][3].pid).isEqualTo({ em: hashA, ph: hashB });
    assertThat(sha256Inputs.length).isEqualTo(0);

    // Invalid stored data is ignored.
    cleanup();
    localStorageData['gtmeec-ms'] = JSON.stringify({ em: 'not-a-hash' });
    runCode(createMockData({ enableEventUserDataEnhancement: true }));
    assertThat(getUetPushes()).isEqualTo([['uetq', 'pageLoad']]);

    assertApi('gtmOnSuccess').wasCalled();
    assertApi('gtmOnFailure').wasNotCalled();
- name: '[Event User Data Enhancement] localStorage is not used when consent is denied'
  code: |-
    localStorageData['gtmeec-ms'] = JSON.stringify({ em: hashA });

    runCode(
      createMockData({
        enableEventUserDataEnhancement: true,
        adStorageConsent: 'denied',
        userDataList: [{ name: 'em', value: 'john@example.com' }]
